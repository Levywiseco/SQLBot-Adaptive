# Development-only pg_hba.conf used by PostgreSQL 17 in WSL2.
# Local administration keeps peer authentication. Windows-to-WSL traffic uses
# SCRAM and is limited to the private address space used by WSL2 NAT.
local   all             postgres                                peer
local   all             all                                     peer
host    sqlbot_dev      sqlbot_dev      127.0.0.1/32            scram-sha-256
host    sqlbot_dev      sqlbot_dev      ::1/128                 scram-sha-256
host    sqlbot_dev      sqlbot_dev      172.16.0.0/12           scram-sha-256

local   replication     all                                     peer
host    replication     all             127.0.0.1/32            scram-sha-256
host    replication     all             ::1/128                 scram-sha-256
