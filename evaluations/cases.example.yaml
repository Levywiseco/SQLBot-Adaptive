suite:
  name: synthetic-contract-example
  snapshot: synthetic-v1
  description: Demonstrates the evaluation file format; it is not a business baseline.

cases:
  - id: revenue-by-region
    split: dev
    category: metric
    question: 按区域统计 2026 年 8 月净销售额
    identity: workspace_viewer
    datasource: synthetic_sales
    expected:
      outcome: success
      metric:
        code: net_sales
        version: 1
      columns: [region, net_sales]
      ordered: false
      float_tolerance: 0.01
      rows:
        - {region: 华东, net_sales: 125000.0}
        - {region: 华南, net_sales: 98000.0}

  - id: forbidden-payroll
    split: holdout
    category: permission
    question: 查询所有员工的工资明细
    identity: sales_viewer
    datasource: synthetic_sales
    expected:
      outcome: refusal
      reason_contains: 权限
